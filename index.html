<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Arch3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v13H4z' fill='%232f6fdf'/%3E%3Cpath d='M13 28v-8h6v8' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <strong class="brand">Arch3D</strong>

      <div class="group" id="tools" role="toolbar" aria-label="Tools">
        <button data-tool="select" title="Select and drag (V)">Select</button>
        <button data-tool="wall" title="Draw walls (W)">Wall</button>
        <button data-tool="door" title="Place a door (D)">Door</button>
        <button data-tool="window" title="Place a window (N)">Window</button>
        <button data-tool="garage" title="Place a garage roller door (G)">Garage</button>
        <button data-tool="split" title="Add a joint to a wall (X)">Split</button>
        <button data-tool="stair" title="Place a stair up to the next floor (S)">Stair</button>
        <button data-tool="roof" title="Set up roofs: types, gable ends, extra roof sections (R)">Roof</button>
        <button data-tool="pillar" title="Place a pillar, e.g. under a veranda roof (P)">Pillar</button>
        <button data-tool="chimney" title="Place a chimney stack with pots (C)">Chimney</button>
        <button data-tool="solar" title="Lay solar panels on a roof slope">Solar</button>
        <button data-tool="rooflight" title="Roof windows, or a rooflight box on a flat roof">Rooflight</button>
        <button data-tool="patio" title="Draw a paved patio, a deck or a gravelled area (T)">Patio</button>
        <button data-tool="tree" title="Plant a tree (E)">Tree</button>
        <button data-tool="paste" id="pasteTool" title="Place exact copies of the copied door/window (Ctrl/⌘+V)" hidden>Paste</button>
      </div>

      <div class="group" id="wallType" aria-label="Wall type">
        <button data-thickness="0.3" title="30 cm exterior wall">Exterior</button>
        <button data-thickness="0.12" title="12 cm partition">Interior</button>
      </div>
      <div class="group" id="stairShape" aria-label="Stair shape">
        <button data-shape="straight" title="Straight flight">Straight</button>
        <button data-shape="L" title="Quarter turn with a landing">L-shape</button>
        <button data-shape="U" title="Half turn with a landing">U-shape</button>
      </div>
      <div class="group" id="roofMode" aria-label="Roof tool">
        <button data-roofmode="edit" title="Select roofs and switch their edges between eave and gable">Edit roofs</button>
        <button data-roofmode="draw" title="Draw an extra roof, e.g. a gable over a bay">Add section</button>
      </div>
      <div class="group" id="patioSurface" aria-label="Patio surface">
        <button data-surface="paving" title="600 mm paving slabs">Paving</button>
        <button data-surface="decking" title="Timber decking, one step up">Decking</button>
        <button data-surface="gravel" title="Gravel">Gravel</button>
      </div>
      <div class="group" id="treeKind" aria-label="Tree">
        <button data-kind="deciduous" title="Broad-leaved: bare in winter">Broadleaf</button>
        <button data-kind="conifer" title="Evergreen conifer">Conifer</button>
      </div>
      <button id="ortho" class="toggle" title="Lock wall directions to 45° steps (O)">Ortho</button>
      <button id="finish" hidden>Finish wall</button>

      <div class="group">
        <button id="undo" title="Undo (Ctrl/⌘+Z)">Undo</button>
        <button id="redo" title="Redo (Ctrl/⌘+Shift+Z)">Redo</button>
      </div>

      <span class="spacer"></span>

      <div class="group" id="layout" aria-label="Layout">
        <button data-layout="plan">Plan</button>
        <button data-layout="split">Both</button>
        <button data-layout="3d">3D</button>
      </div>
      <div class="group" id="mode" aria-label="3D mode">
        <button data-mode="orbit" title="Orbit around the model">Orbit</button>
        <button data-mode="walk" title="Walk through at eye level">Walk</button>
      </div>
      <button id="sun" class="toggle" title="Sun study: the real sun for a date, time and place, with shadows">Sun</button>
      <button id="cutaway" class="toggle on" title="In orbit view, hide the floors above the one you are editing">Cutaway</button>
      <details class="menu">
        <summary>File</summary>
        <div class="menu-items">
          <button id="new">New empty building</button>
          <button id="demo">Load demo house</button>
          <button id="saveShared">Save to computer…</button>
          <button id="openShared">Open from computer…</button>
          <hr />
          <button id="export">Export JSON…</button>
          <button id="import">Import JSON…</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
      </details>
    </header>

    <main class="work" id="work" data-layout="split">
      <section class="pane" id="planPane">
        <aside class="panel" id="panel"></aside>
        <nav class="levels" id="levels" aria-label="Floors"></nav>
        <div class="hint" id="hint"></div>
      </section>
      <section class="pane" id="viewPane">
        <aside class="panel sunpanel" id="sunPanel" hidden></aside>
        <div class="overlay" id="walkHint" hidden></div>
      </section>
    </main>
    <dialog id="drawingsDialog">
      <form method="dialog">
        <h2>Drawings saved on the computer</h2>
        <p class="note">Newest first. Opening one replaces what is on screen (Undo brings it back).</p>
        <ul id="drawingsList"></ul>
        <button value="cancel">Close</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
